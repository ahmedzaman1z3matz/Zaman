<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Quiz App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-card { background: white; border-radius: 16px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .quiz-header { text-align: center; margin-bottom: 20px; }
        .quiz-header h2 { color: #1a73e8; margin-bottom: 5px; }
        .question-box { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 20px; line-height: 1.5; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px; padding: 12px 15px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s ease; outline: none; }
        .option-btn:hover { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.incorrect { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .next-btn { margin-top: 20px; width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; }
        .score-card { text-align: center; padding: 20px 0; }
        .score-card h3 { font-size: 1.8rem; color: #28a745; margin-bottom: 10px; }
        .restart-btn { margin-top: 15px; padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="quiz-card" id="quiz-card">
        <div class="quiz-header">
            <h2>🧠 Quiz Time</h2>
            <p id="progress">Sawal 1 / 3</p>
        </div>

        <div id="quiz-body">
            <div class="question-box" id="question">Sawal yahan aayega...</div>
            <div class="options-container" id="options"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Agla Sawal ➔</button>
        </div>

        <div class="score-card" id="score-card" style="display: none;">
            <h3>Mubarak Ho! 🎉</h3>
            <p id="score-text">Aapka score: 0 / 0</p>
            <button class="restart-btn" onclick="restartQuiz()">Dobara Khelain</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Pakistan ka qaumi khel (National Sport) kaun sa hai?",
                options: ["Cricket", "Hockey", "Football", "Squash"],
                correct: 1
            },
            {
                question: "Duniya ki sabse lambi nadi (River) kaun si hai?",
                options: ["Amazon", "Indus", "Nile (Neel)", "Yangtze"],
                correct: 2
            },
            {
                question: "Computer ka dimaag (Brain of Computer) kise kaha jata hai?",
                options: ["RAM", "Hard Disk", "CPU", "Monitor"],
                correct: 2
            }
        ];

        let currentIdx = 0;
        let score = 0;

        function loadQuestion() {
            const currentData = quizData[currentIdx];
            document.getElementById("progress").innerText = `Sawal ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById("question").innerText = currentData.question;
            
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            document.getElementById("next-btn").style.display = "none";

            currentData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, index, currentData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedIdx, correctIdx) {
            const allButtons = document.querySelectorAll(".option-btn");
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIdx === correctIdx) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("incorrect");
                allButtons[correctIdx].classList.add("correct");
            }

            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            document.getElementById("quiz-body").style.display = "none";
            document.getElementById("score-card").style.display = "block";
            document.getElementById("score-text").innerText = `Aap ne ${quizData.length} mein se ${score} sahi jawabat diye!`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            document.getElementById("quiz-body").style.display = "block";
            document.getElementById("score-card").style.display = "none";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
